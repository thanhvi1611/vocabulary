<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Khai báo thư viện Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <title>Luyện Gõ & Sổ Từ Vựng</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 800px; margin: 0 auto; }
    
    .badge-due {
  background-color: #ea4335;
  color: white;
  font-size: 11px;
  font-weight: bold;
  padding: 2px 7px;
  border-radius: 10px;
  margin-left: 6px;
  vertical-align: middle;
  display: inline-block;
}
    /* Navigation Tabs */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
    .tab-btn { flex: 1; min-width: 120px; background: #e0e0e0; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; color: #555; text-align: center; }
    .tab-btn.active { background: #1a73e8; color: white; }

    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    
    /* Form Thêm Từ */
    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 4px; }
    .input-with-btn { display: flex; gap: 6px; }
    .btn-auto { background: #34a853; color: white; border: none; padding: 0 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn-save { width: 100%; background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; margin-top: 10px; }
    #status { font-size: 13px; text-align: center; margin-top: 10px; min-height: 20px; font-weight: bold; }

    /* Quiz Area */
    .stats { font-size: 13px; color: #666; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .badge { background: #e8f0fe; color: #1a73e8; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    .meaning { font-size: 24px; font-weight: bold; color: #202124; margin: 15px 0 5px 0; text-align: center; }
    .phonetic { font-size: 15px; color: #d93025; margin-bottom: 20px; height: 22px; text-align: center; }
    
    input[type="text"] { width: 100%; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; outline: none; }
    input.quiz-input { font-size: 18px; text-align: center; border-width: 2px; }
    input.correct { border-color: #34a853 !important; background-color: #e6f4ea; }
    input.incorrect { border-color: #ea4335 !important; background-color: #fce8e6; }
    
    .hint { margin-top: 15px; font-size: 13px; color: #777; min-height: 20px; text-align: center; }
    .btn-action { background: #1a73e8; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .day-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #f0f0f0; padding-bottom: 6px; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-play-sm { background: #34a853; color: white; }
  </style>
</head>
<body>
  <div style="background: #e8f0fe; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 8px; align-items: center;">
  <span style="font-size: 13px; font-weight: bold; color: #1a73e8;">🔑 Mã đồng bộ:</span>
  <input type="text" id="sync-code-input" placeholder="Nhập mã bí mật (ví dụ: ThayMai2026)" style="flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px;">
  <button id="btn-save-sync-code" style="background: #1a73e8; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">Lưu mã</button>
</div>
  <div class="container">
    <div class="nav-tabs">
      <button id="tab-add-btn" class="tab-btn">✨ Thêm Từ Mới</button>
      <button id="tab-practice-btn" class="tab-btn active">⌨️ Luyện Gõ</button>
      <button id="tab-manage-btn" class="tab-btn">📅 Danh Sách Bài Học</button>
    </div>

    <!-- TAB 1: THÊM TỪ VỰNG & DỊCH NHANH -->
    <div id="add-view" class="card" style="display: none;">
      <h3 style="margin-top: 0; color: #1a73e8; text-align: center;">✨ Thêm Từ Vựng Mới</h3>
      
      <div class="form-group">
        <label for="input-word">Từ Tiếng Anh hoặc Tiếng Việt:</label>
        <div class="input-with-btn">
          <input type="text" id="input-word" placeholder="Nhập 'cat' hoặc 'con mèo'...">
          <button id="btn-translate" class="btn-auto">⚡ Dịch</button>
        </div>
      </div>

      <div class="form-group">
        <label for="input-meaning">Nghĩa Tiếng Việt:</label>
        <input type="text" id="input-meaning" placeholder="Nghĩa tiếng Việt...">
      </div>

      <div class="form-group">
        <label for="input-phonetic">Phiên âm IPA:</label>
        <input type="text" id="input-phonetic" placeholder="/Phát âm/">
      </div>

      <button id="btn-save-vocab" class="btn-save">💾 Lưu Vào Sổ Từ Vựng</button>
      <div id="status"></div>
    </div>

    <!-- TAB 2: MÀN HÌNH LUYỆN GÕ -->
    <div id="practice-view" class="card">
          <!-- Nút Tab Luyện tập trong HTML -->
<button id="tab-practice-btn" class="tab-btn">
  🎯 Luyện tập
  <span id="due-count-badge" class="badge-due" style="display: none;">0</span>
</button>
      <div id="header-stats" class="stats">
        <span id="type-badge" class="badge">Từ mới</span>
        <div style="display:flex; gap:8px; align-items:center;">
          <select id="speech-rate-select" style="font-size:12px; padding:2px;">
            <option value="0.75">0.75x</option>
            <option value="1.0" selected>1.0x</option>
          </select>
          <label style="font-size:12px;"><input type="checkbox" id="auto-audio-toggle" checked> 🔊 Nối âm</label>
        </div>
        <span id="progress-text">0 / 0 từ</span>
      </div>

      <div id="quiz-area" style="text-align: center;">
        <button id="speak-btn" style="background:none; border:1px solid #ddd; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px;">🔊 Nghe phát âm</button>
        <div id="meaning" class="meaning">Đang tải...</div>
        <div id="phonetic" class="phonetic"></div>

        <input type="text" id="type-input" class="quiz-input" placeholder="Gõ từ tiếng Anh vào đây..." autocomplete="off" autofocus>
        <div id="hint" class="hint">Nhấn Enter để kiểm tra</div>
      </div>

      <div id="completed-area" style="display: none; text-align: center;">
        <div style="font-size: 40px; margin-bottom: 10px;">🎉</div>
        <div style="font-size: 18px; color: #34a853; font-weight: bold; margin-bottom: 10px;">Hoàn thành bài học!</div>
        <div id="complete-detail" style="font-size: 14px; color: #555; margin-bottom: 20px;"></div>
        <button id="restart-btn" class="btn-action">🔄 Học lại lượt này</button>
      </div>
    </div>

    <!-- TAB 3: DANH SÁCH BÀI HỌC -->
    <div id="manage-view" class="card" style="display: none;">
      <h3 style="margin-top: 0; color: #1a73e8;">Danh Sách Bài Học Nhóm Theo Ngày</h3>
      <div id="day-list-container"></div>
    </div>

  </div>
  

  <script src="practice.js"></script>
</body>
</html>
