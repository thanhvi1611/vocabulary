<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <!-- Cấu hình cho Safari trên iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Luyện Từ">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3898/3898082.png">
  <title>Luyện Gõ & Quản Lý Từ Vựng</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 800px; margin: 0 auto; }
    
    /* Navigation Tabs */
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { background: #e0e0e0; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; color: #555; }
    .tab-btn.active { background: #1a73e8; color: white; }

    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    
    /* Quiz Area */
    .stats { font-size: 13px; color: #666; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .badge { background: #e8f0fe; color: #1a73e8; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    .badge.review { background: #fef7e0; color: #b06000; }
    
    /* Controls Header */
    .controls-group { display: flex; align-items: center; gap: 12px; }
    .audio-control { display: flex; align-items: center; gap: 6px; background: #f1f3f4; padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #555; cursor: pointer; user-select: none; }
    .speed-select { font-size: 12px; padding: 2px 6px; border-radius: 12px; border: 1px solid #ccc; background: #fff; cursor: pointer; }

    .meaning { font-size: 24px; font-weight: bold; color: #202124; margin: 15px 0 5px 0; }
    .phonetic { font-size: 15px; color: #d93025; margin-bottom: 20px; height: 22px; }
    
    input[type="text"] { width: 100%; max-width: 400px; padding: 12px; font-size: 18px; border: 2px solid #ccc; border-radius: 6px; box-sizing: border-box; text-align: center; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: #1a73e8; }
    input.correct { border-color: #34a853 !important; background-color: #e6f4ea; }
    input.incorrect { border-color: #ea4335 !important; background-color: #fce8e6; }
    
    .hint { margin-top: 15px; font-size: 13px; color: #777; min-height: 20px; }
    .shortcut-tip { font-size: 11px; color: #888; margin-top: 6px; }

    button.btn-speak { background: none; border: 1px solid #ddd; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-bottom: 10px; font-size: 13px; }
    button.btn-speak:hover { background: #f8f9fa; }
    
    .btn-action { background: #1a73e8; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; margin-top: 15px; }
    .btn-action:hover { background: #1557b0; }

    /* Manager Table */
    .day-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; text-align: left; }
    .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px; }
    .day-title { font-weight: bold; font-size: 15px; color: #1a73e8; }
    .words-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .word-tag { background: #f1f3f4; padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #333; }
    
    .btn-sm { padding: 6px 12px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-play-sm { background: #34a853; color: white; }
    .btn-play-sm:hover { background: #2d8e47; }
    
    .interval-select { padding: 5px; border-radius: 4px; border: 1px solid #ccc; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
<div id="vocab-list-container"></div>
    <div class="nav-tabs">
      <button id="tab-practice-btn" class="tab-btn active">⌨️ Luyện Gõ Hôm Nay</button>
      <button id="tab-manage-btn" class="tab-btn">📅 Danh Sách Bài Học Theo Ngày</button>
    </div>

    <!-- TAB 1: MÀN HÌNH LUYỆN GÕ -->
    <div id="practice-view" class="card">
      <div id="header-stats" class="stats">
        <span id="type-badge" class="badge">Từ mới</span>
        
        <div class="controls-group">
          <!-- Tốc độ đọc -->
          <select id="speech-rate-select" class="speed-select" title="Tốc độ phát âm">
            <option value="0.75">Tốc độ: 0.75x</option>
            <option value="1.0" selected>Tốc độ: 1.0x</option>
          </select>

          <!-- Nút Tắt/Bật phát âm -->
          <label class="audio-control">
            <input type="checkbox" id="auto-audio-toggle" checked>
            <span id="audio-toggle-label">🔊 Âm thanh: <b>Bật</b></span>
          </label>
        </div>

        <span id="progress-text">0 / 0 từ</span>
      </div>

      <div id="quiz-area">
        <button id="speak-btn" class="btn-speak">🔊 Nghe phát âm (Phím `Ctrl+Space` / `Ctrl+Shift`)</button>
        <div id="meaning" class="meaning">Đang tải...</div>
        <div id="phonetic" class="phonetic"></div>

        <input type="text" id="type-input" placeholder="Gõ từ tiếng Anh vào đây..." autocomplete="off" autofocus>
        <div id="hint" class="hint">Nhấn Enter để kiểm tra</div>
        <div class="shortcut-tip">💡 Mẹo: Nhấn <b>Ctrl + Space</b> để nghe lại | Nhấn <b>Ctrl + M</b> để Bật/Tắt âm thanh</div>
      </div>

      <div id="completed-area" style="display: none;">
        <div style="font-size: 40px; margin-bottom: 10px;">🎉</div>
        <div id="complete-msg" style="font-size: 18px; color: #34a853; font-weight: bold; margin-bottom: 10px;">Hoàn thành bài học!</div>
        <div id="complete-detail" style="font-size: 14px; color: #555; margin-bottom: 20px;"></div>
        <button id="restart-btn" class="btn-action">🔄 Học lại lượt này</button>
      </div>
    </div>

    <!-- TAB 2: MÀN HÌNH QUẢN LÝ BÀI HỌC THEO NGÀY -->
    <div id="manage-view" class="card" style="display: none; text-align: left;">
      <h3 style="margin-top: 0; color: #1a73e8;">Danh Sách Bài Học Nhóm Theo Ngày</h3>
      <p style="font-size: 13px; color: #666;">Thầy có thể bấm <b>"▶ Học lại bài ngày này"</b> để gõ lại toàn bộ từ vựng đã lưu của ngày đó.</p>
      
      <div id="day-list-container"></div>
    </div>
  </div>

  <script src="practice.js"></script>
</body>
</html>
